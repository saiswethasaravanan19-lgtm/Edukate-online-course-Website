<html>
<head>
<title>PixelNest</title>
<style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("img/bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 500px;
            padding: 30px;
            background: rgba(255,255,255,0.8);
            border-radius: 10px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
		.gender-group {
    display: flex;
    align-items: center;
    gap: 20px;
}

.gender-group label {
    margin-right: 10px;
}

        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body bgcolor="#0F172A"><center>
<h1 style="color:#38BDF8;text-align:center;font-size:40px;font-family:Arial, sans-serif;"> REGISTER PAGE</h1>
<table style="background-color:#1E293B;padding:25px;border-radius:12px;box-shadow:0px 0px 15px #0EA5E9;color:white;cellspacing="15"">

<tr>

</tr>
<tr>

</tr>
<tr>

<td><input type="text" name="address"></td>
</tr>

    </td>
</tr>
<tr>
<td><label>PHONE NO:</label></td>

</tr>
<tr>
<td><label>EMAIL ID:</label></td>
<td><input type="text" name="email"></td>
</tr></table><br>
